name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: eirinchan_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eirinchan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      TEST_DATABASE_URL: ecto://postgres:postgres@localhost/eirinchan_test

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: 27.3.4.12
          elixir-version: 1.20.2

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg imagemagick libimage-exiftool-perl whois

      - name: Restore dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp27-elixir1.20-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: mix deps.compile

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Run test suite
        run: mix test
