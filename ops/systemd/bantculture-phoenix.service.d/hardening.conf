[Service]
User=@EIRINCHAN_DEPLOY_USER@
Group=@EIRINCHAN_DEPLOY_GROUP@
WorkingDirectory=@EIRINCHAN_STATE_ROOT@
ExecStart=
ExecStart=@EIRINCHAN_CURRENT_LINK@/bin/start-production
StandardOutput=append:@EIRINCHAN_LOG_DIR@/@EIRINCHAN_PHOENIX_LOG_NAME@
StandardError=append:@EIRINCHAN_LOG_DIR@/@EIRINCHAN_PHOENIX_LOG_NAME@

# Keep a compromised web process from changing application source, startup
# scripts, SSH material, or instance secrets. Runtime state is limited to the
# paths Eirinchan intentionally owns.
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=@EIRINCHAN_STATE_ROOT@/tmp
ReadWritePaths=@EIRINCHAN_STATE_ROOT@/var
ReadWritePaths=@EIRINCHAN_LOG_DIR@
InaccessiblePaths=@EIRINCHAN_STATE_ROOT@/_build

# The application needs no Linux capabilities or privileged device access.
CapabilityBoundingSet=
AmbientCapabilities=
PrivateDevices=true
PrivateTmp=true
ProtectClock=true
ProtectControlGroups=true
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
ProtectHostname=true
LockPersonality=true
RestrictRealtime=true
RestrictSUIDSGID=true
SystemCallArchitectures=native

# Bound resource exhaustion without constraining normal image/video workers.
TasksMax=512
MemoryMax=2G
UMask=0077
